<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIPS — dice poker, played by ear</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="table" id="table">
  <header class="hud">
    <div class="brand">PIPS.<span>dice poker · played by ear</span></div>
    <div class="hud-right">
      <button class="ghost" id="muteBtn">sound on</button>
    </div>
  </header>

  <div class="scorebar">
    <div class="scorebox">
      <span class="cap">score</span>
      <span class="big" id="scoreEl">0</span>
      <span class="target" id="targetEl">/ 500</span>
    </div>
    <div class="metabox">
      <div class="meta"><span class="cap">hands</span><span class="mval" id="handsEl">4</span></div>
      <div class="meta"><span class="cap">shakes</span><span class="mval" id="rerollsEl">3</span></div>
      <div class="meta"><span class="cap">round</span><span class="mval" id="roundEl">1/3</span></div>
    </div>
  </div>

  <div class="main">
    <main class="stage">
      <div class="stamp-layer" id="stampLayer"></div>
      <div class="dice" id="diceMount"></div>
      <div class="preview" id="preview">
        <span class="pname" id="pName">—</span>
        <span class="pmath" id="pMath"></span>
      </div>
      <p class="msg" id="msg"></p>
      <div class="controls">
        <button class="playbtn" id="playBtn" disabled>PLAY</button>
        <span class="hint">hold space / table to shake the loose dice</span>
      </div>
    </main>

    <aside class="combos">
      <div class="cap">hands</div>
      <div id="comboList"></div>
    </aside>
  </div>
</div>

<div class="end" id="end">
  <div class="end-card">
    <div class="end-name" id="endName"></div>
    <div class="end-stats" id="endStats"></div>
    <div class="end-btns">
      <button class="ghost gold" id="againBtn">play again</button>
    </div>
  </div>
</div>

<script src="tone.js"></script>
<script src="audio.js"></script>
<script src="main.js"></script>
</body>
</html>
